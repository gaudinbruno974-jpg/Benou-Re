name: benou_re
description: >-
  Application de gestion de la R∴L∴ Bénou Ré : membres, tenues, présences et
  émargement, trésorerie et paiement des agapes, génération des documents PDF
  (convocation, feuille de présence, planche tracée) et archivage Google Drive.
publish_to: 'none'
# Versionnage : <majeure>.<mineure>.<corrective>+<numéro de build>.
# - majeure  : rupture de modèle de données ou de déploiement (ex. passage au
#              multi-loges avec un projet Firebase par loge) ;
# - mineure  : nouvel écran ou nouvelle fonctionnalité ;
# - corrective : correctifs et retouches de libellés ;
# - build    : incrémenté à chaque publication (APK / Firebase Hosting), jamais
#              réutilisé — c'est ce que le Play Store compare.
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  provider: ^6.1.5+1
  intl: ^0.20.2
  pdf: ^3.13.0
  printing: ^5.15.0
  collection: ^1.19.1
  signature: ^6.3.0
  google_sign_in: ^6.2.1
  http: ^1.2.2
  web: ^1.1.0
  shared_preferences: ^2.5.3   # <--- NOUVEAU : indispensable pour la case à cocher
  file_picker: ^8.1.6
  archive: ^4.0.9
  xml: ^7.0.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

# file_picker (Android) est publié figé à compileSdk 34 ; les versions de
# flutter_plugin_android_lifecycle >= 2.0.25 exigent compileSdk 36, ce qui
# casse le build APK release (CheckAarMetadataWorkAction). 2.0.24 est la
# dernière version encore figée à compileSdk 34, compatible avec file_picker.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

flutter_launcher_icons:
  image_path: "assets/icon/LogoApkBenou.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/LogoApkBenou.png"
    background_color: "#1A4A55"
    theme_color: "#1A4A55"

flutter:
  uses-material-design: true
  assets:
    - assets/GLDB.png
    - assets/Benou-Re.png
    - assets/Petit-Prince.png
    - assets/Temple-Horus.png
    - assets/Al-Khemia.png
    - assets/icon/LogoApkBenou.png
    - assets/icon/LogoApkAlKhemia.png
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf